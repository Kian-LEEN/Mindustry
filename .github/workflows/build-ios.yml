name: Build Mindustry iOS IPA

on:
  workflow_dispatch: # Cho phép bấm nút chạy thủ công
  push:
    branches: [ master, main ]

jobs:
  build-ios:
    runs-on: macos-14 # Dùng macOS runner có sẵn Xcode

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build iOS IPA with RoboVM
        run: |
          # Chạy task build IPA của RoboVM không yêu cầu signing cert chính chủ (dùng ad-hoc/unsigned)
          ./gradlew ios:createIPA -Probovm.ios.skipSigning=true || ./gradlew ios:createIPA

      - name: Locate and Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mindustry-iOS
          path: |
            ios/build/robovm/*.ipa
            core/build/libs/*.jar
